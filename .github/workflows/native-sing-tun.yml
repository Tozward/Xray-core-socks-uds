name: Native sing-tun verification

on:
  push:
    branches: [feature/native-sing-tun]
  workflow_dispatch:
    inputs:
      mode:
        description: Verification or focused Linux profiling
        type: choice
        options: [verify, profile]
        default: verify
      profile_transport:
        description: Profile transport
        type: choice
        options: [all, freedom, vision_tls13]
        default: all
      profile_workload:
        description: Bulk direction (duplex is aggregate echo)
        type: choice
        options: [all, duplex, upload, download]
        default: all
      profile_path:
        description: Path (direct engine control supports freedom only)
        type: choice
        options: [all, hev_android_defaults, socks_full_splice, socks_full_splice_jumbo, native_read_write, native_download_splice, native_vector_write, native_bidirectional_splice, native_bidirectional_jumbo, sing_direct_engine]
        default: all
      profiler:
        description: Diagnostic instrumentation, separate from timing baseline
        type: choice
        options: [cpu, block, trace, all]
        default: cpu

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'profile'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Ordinary build remains independent of sing-tun
        shell: bash
        run: |
          if go list -deps ./main | grep -q '^github.com/sagernet/sing'; then
            echo 'Default binary unexpectedly links optional GPL dependencies'
            exit 1
          fi
          go build -o default-xray${{ runner.os == 'Windows' && '.exe' || '' }} ./main
          go test ./proxy ./proxy/tun ./infra/conf ./app/dispatcher ./common/buf
      - name: Native tests and race checks
        shell: bash
        run: |
          go test -race -tags with_sing_tun ./proxy ./proxy/singtun ./proxy/tun ./infra/conf ./app/dispatcher ./common/buf -timeout=5m
          go vet -tags with_sing_tun ./proxy/singtun ./proxy
      - name: Native CLI build
        shell: bash
        run: go build -tags with_sing_tun -trimpath -o native-xray${{ runner.os == 'Windows' && '.exe' || '' }} ./main
      - name: Linux native descriptor and real Vision regressions
        if: runner.os == 'Linux'
        run: |
          go test -race -tags with_sing_tun -c ./proxy/singtun -o native-tun-test
          sudo env XRAY_REQUIRE_NATIVE_TUN_TESTS=1 ./native-tun-test -test.v -test.run '^TestNativeKernel' -test.count=3 -test.timeout=3m
      - name: Checkout APK-pinned HEV for comparison
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: heiher/hev-socks5-tunnel
          ref: c5584feca8f6df70ee53eb2879e034b849a3d15a
          submodules: recursive
          path: benchmark-deps/hev
          persist-credentials: false
      - name: Build HEV library runner with supplied TUN descriptor
        if: runner.os == 'Linux'
        run: |
          make -C benchmark-deps/hev -j2 static
          cc -O3 -Ibenchmark-deps/hev/include proxy/singtun/testdata/hev_runner.c \
            benchmark-deps/hev/bin/libhev-socks5-tunnel.a \
            benchmark-deps/hev/third-part/yaml/bin/libyaml.a \
            benchmark-deps/hev/third-part/lwip/bin/liblwip.a \
            benchmark-deps/hev/third-part/hev-task-system/bin/libhev-task-system.a \
            -pthread -o "$RUNNER_TEMP/hev-bench"
      - name: Linux matched-path benchmark
        if: runner.os == 'Linux'
        run: |
          go test -tags with_sing_tun -c ./proxy/singtun -o native-tun-bench
          sudo env XRAY_REQUIRE_NATIVE_TUN_TESTS=1 XRAY_HEV_BENCHMARK_BINARY="$RUNNER_TEMP/hev-bench" XRAY_HEV_CLOCK_TICKS="$(getconf CLK_TCK)" \
            ./native-tun-bench -test.run '^$' -test.bench '^BenchmarkKernelNativeEchoDuplex$' -test.benchmem -test.benchtime=2s -test.count=3 -test.timeout=10m | tee native-benchmark.txt
          test "${PIPESTATUS[0]}" = 0
          python3 - <<'PY'
          from pathlib import Path

          result = Path('native-benchmark.txt').read_text()
          # Validate every subcase as well as the process status.
          if '--- FAIL:' in result or 'WARNING: DATA RACE' in result:
              raise SystemExit('Benchmark includes a failed subcase')
          rows = [line for line in result.splitlines() if ' ns/op' in line and ' allocs/op' in line]
          if len(rows) != 60:
              raise SystemExit(f'Expected 60 measured results, found {len(rows)}')
          for row in rows:
              mtu = 9000 if '/mtu_9000/' in row else 1500
              fields = row.split()
              if int(fields[fields.index('path-MTU') - 1]) != mtu:
                  raise SystemExit(f'Incorrect actual MTU: {row}')
          PY
      - name: Preserve benchmark evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: native-benchmark-${{ github.sha }}
          path: native-benchmark.txt
          if-no-files-found: ignore
  format:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./infra/vformat/main.go -mode check -pwd ./
      - run: go run ./infra/vprotogen/main.go -mode check -pwd ./
  profile:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE_TRANSPORT: ${{ inputs.profile_transport }}
      PROFILE_WORKLOAD: ${{ inputs.profile_workload }}
      PROFILE_PATH: ${{ inputs.profile_path }}
      PROFILER: ${{ inputs.profiler }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v7
        with:
          repository: heiher/hev-socks5-tunnel
          ref: c5584feca8f6df70ee53eb2879e034b849a3d15a
          submodules: recursive
          path: benchmark-deps/hev
          persist-credentials: false
      - name: Build focused benchmark and pinned HEV runner
        run: |
          mkdir -p profile-evidence
          go test -tags with_sing_tun ./proxy/singtun -run '^TestKernelBenchmark(OneWayProtocol|NativeCapabilities|TCPPacketSize)$' -count=1
          go test -tags with_sing_tun -c ./proxy/singtun -o profile-evidence/native-tun-bench
          make -C benchmark-deps/hev -j2 static
          cc -O3 -Ibenchmark-deps/hev/include proxy/singtun/testdata/hev_runner.c \
            benchmark-deps/hev/bin/libhev-socks5-tunnel.a \
            benchmark-deps/hev/third-part/yaml/bin/libyaml.a \
            benchmark-deps/hev/third-part/lwip/bin/liblwip.a \
            benchmark-deps/hev/third-part/hev-task-system/bin/libhev-task-system.a \
            -pthread -o "$RUNNER_TEMP/hev-bench"
      - name: Record measurement scope and machine
        run: |
          {
            echo 'Baseline: uninstrumented, 3 x 2s per selected case, actual TUN MTU9000.'
            echo 'Duplex counts 8MiB/op; upload/download count 4MiB/op plus uncounted one-byte controls.'
            echo 'CPU totals include this Go process (application/Xray/local Vision node) and the HEV child.'
            echo 'Go CPU/block/trace profiles exclude HEV child execution and C allocations.'
            echo 'Legacy native controls retain 8KiB SingleReader/sequential Write; download-only hides raw upload.'
            echo 'Manual vector and bidirectional paths are separate; only named _jumbo paths explicitly enable local jumbo.'
            echo 'socks_full_splice_jumbo matches native_bidirectional_jumbo; the historical SOCKS control retains MTU-sized output.'
            echo 'Raw progress must cover the measured bulk direction; jumbo must emit a real above-MTU TCP receive packet during warmup.'
            echo 'The jumbo packet observer closes and joins before timing; native progress counters remain active for path accounting.'
            echo 'Diagnostics start after warmup; instrumented results must not be ranked with the baseline.'
            echo 'CPU/trace retain final calibration run; block accumulates measured intervals of one case.'
            echo 'This is a local Linux control, not Android or external-network throughput/energy.'
            echo "Core: $GITHUB_SHA"
            git -C benchmark-deps/hev rev-parse HEAD
            git -C benchmark-deps/hev submodule status
            go version
            go version -m profile-evidence/native-tun-bench
            uname -a
            lscpu
            getconf CLK_TCK
          } > profile-evidence/environment.txt
      - name: Measure baseline then profile each selected path
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE_TRANSPORT" in all|freedom|vision_tls13) ;; *) exit 2 ;; esac
          case "$PROFILE_WORKLOAD" in all|duplex|upload|download) ;; *) exit 2 ;; esac
          case "$PROFILE_PATH" in all|hev_android_defaults|socks_full_splice|socks_full_splice_jumbo|native_read_write|native_download_splice|native_vector_write|native_bidirectional_splice|native_bidirectional_jumbo|sing_direct_engine) ;; *) exit 2 ;; esac
          case "$PROFILER" in cpu|block|trace) profilers=("$PROFILER") ;; all) profilers=(cpu block trace) ;; *) exit 2 ;; esac
          if [[ "$PROFILE_TRANSPORT" == vision_tls13 && "$PROFILE_PATH" == sing_direct_engine ]]; then
            echo 'The direct engine control bypasses Xray and supports freedom only.'
            exit 2
          fi
          ticks=$(getconf CLK_TCK)
          # Complete every uninstrumented run before enabling any profiler.
          for phase in baseline diagnostic; do
          for transport in freedom vision_tls13; do
            [[ "$PROFILE_TRANSPORT" == all || "$PROFILE_TRANSPORT" == "$transport" ]] || continue
            modes=(hev_android_defaults socks_full_splice socks_full_splice_jumbo native_read_write native_download_splice native_vector_write native_bidirectional_splice native_bidirectional_jumbo)
            [[ "$transport" != freedom ]] || modes+=(sing_direct_engine)
            for workload in duplex upload download; do
              [[ "$PROFILE_WORKLOAD" == all || "$PROFILE_WORKLOAD" == "$workload" ]] || continue
              for mode in "${modes[@]}"; do
                [[ "$PROFILE_PATH" == all || "$PROFILE_PATH" == "$mode" ]] || continue
                name="$transport/$workload/mtu_9000/$mode"
                directory="$PWD/profile-evidence/$name"
                mkdir -p "$directory"
                pattern="^BenchmarkKernelNativeProfile$/$transport/$workload/mtu_9000/$mode\$"
                if [[ "$phase" == baseline ]]; then
                  sudo env XRAY_REQUIRE_NATIVE_TUN_TESTS=1 XRAY_HEV_BENCHMARK_BINARY="$RUNNER_TEMP/hev-bench" XRAY_HEV_CLOCK_TICKS="$ticks" \
                    profile-evidence/native-tun-bench -test.run '^$' -test.bench "$pattern" -test.benchmem -test.benchtime=2s -test.count=3 -test.timeout=2m \
                    | tee "$directory/baseline.txt"
                  continue
                fi
                for profiler in "${profilers[@]}"; do
                  case "$profiler" in cpu) duration=5s ;; block) duration=2s ;; trace) duration=1s ;; esac
                  output="$directory/$profiler"
                  mkdir -p "$output"
                  sudo env XRAY_REQUIRE_NATIVE_TUN_TESTS=1 XRAY_HEV_BENCHMARK_BINARY="$RUNNER_TEMP/hev-bench" XRAY_HEV_CLOCK_TICKS="$ticks" \
                    XRAY_NATIVE_PROFILE="$profiler" XRAY_NATIVE_PROFILE_DIR="$output" \
                    profile-evidence/native-tun-bench -test.run '^$' -test.bench "$pattern" -test.benchmem -test.benchtime="$duration" -test.count=1 -test.timeout=2m \
                    | tee "$output/diagnostic.txt"
                  if [[ "$profiler" == trace ]]; then
                    for kind in sched sync syscall net; do
                      go tool trace -pprof="$kind" "$output/trace.trace" > "$output/$kind.pprof"
                      go tool pprof -top -nodecount=60 profile-evidence/native-tun-bench "$output/$kind.pprof" > "$output/$kind.txt"
                    done
                  else
                    go tool pprof -top -nodecount=80 profile-evidence/native-tun-bench "$output/$profiler.pprof" > "$output/top.txt"
                    go tool pprof -top -cum -nodecount=80 profile-evidence/native-tun-bench "$output/$profiler.pprof" > "$output/cumulative.txt"
                  fi
                done
              done
            done
          done
          done
          python3 - <<'PY'
          from pathlib import Path

          root = Path('profile-evidence')
          baselines = list(root.glob('*/*/mtu_9000/*/baseline.txt'))
          if not baselines:
              raise SystemExit('No selected baseline cases ran')
          for path in baselines:
              result = path.read_text()
              rows = [line for line in result.splitlines() if ' ns/op' in line and ' allocs/op' in line]
              if len(rows) != 3 or '--- FAIL:' in result or 'WARNING: DATA RACE' in result or 'SKIP' in result:
                  raise SystemExit(f'Incomplete baseline: {path}')
              for row in rows:
                  fields = row.split()
                  if int(fields[fields.index('path-MTU') - 1]) != 9000:
                      raise SystemExit(f'Incorrect actual MTU: {row}')
                  if float(fields[fields.index('cpu-ms/op') - 1]) <= 0:
                      raise SystemExit(f'Missing CPU accounting: {row}')
                  mode, workload = path.parent.name, path.parents[2].name
                  if mode.startswith('native_'):
                      upload = float(fields[fields.index('native-up-B/op') - 1])
                      download = float(fields[fields.index('native-down-B/op') - 1])
                      bidirectional = mode in ('native_bidirectional_splice', 'native_bidirectional_jumbo')
                      if (upload > 0) != bidirectional:
                          raise SystemExit(f'Unexpected native upload path: {row}')
                      if (download > 0) != (bidirectional or mode == 'native_download_splice'):
                          raise SystemExit(f'Unexpected native download path: {row}')
                      if bidirectional and workload != 'download' and upload < 4 * 1024 * 1024:
                          raise SystemExit(f'Native upload did not handle bulk data: {row}')
                      if (bidirectional or mode == 'native_download_splice') and workload != 'upload' and download < 4 * 1024 * 1024:
                          raise SystemExit(f'Native download did not handle bulk data: {row}')
                  if mode.endswith('_jumbo') and float(fields[fields.index('jumbo-max-IP-B') - 1]) <= 9000:
                      raise SystemExit(f'Local jumbo never emitted above-MTU data: {row}')
          for path in root.glob('*/*/mtu_9000/*/*/diagnostic.txt'):
              result = path.read_text()
              if ' ns/op' not in result or '--- FAIL:' in result or 'WARNING: DATA RACE' in result or 'SKIP' in result:
                  raise SystemExit(f'Incomplete diagnostic: {path}')
          print(f'Validated {len(baselines)} paths, {3 * len(baselines)} uninstrumented rows')
          PY
      - name: Preserve raw profiles and uninstrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-profile-${{ github.sha }}
          path: profile-evidence
          if-no-files-found: ignore
          retention-days: 14
